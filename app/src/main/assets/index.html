<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#090a0c">
<title>NightCode</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2.5l2.4 6.1 6.1 2.4-6.1 2.4L12 19.5l-2.4-6.1L3.5 11l6.1-2.4z"/><path d="M19 3v4M21 5h-4" stroke-width="1.5"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.2 14.8A8.4 8.4 0 1 1 9.2 3.8a6.8 6.8 0 0 0 11 11z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-arrow-r" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.6-2h4.8L16 7h2.5A1.5 1.5 0 0 1 20 8.5v8A1.5 1.5 0 0 1 18.5 18h-13A1.5 1.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.2"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 15.5l-4.5-4.5-8 8"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/><path d="M13.5 3v5.5H19"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.3 3.9 5.2 3.9 8.5S14.6 18.2 12 20.5c-2.6-2.3-3.9-5.2-3.9-8.5S9.4 5.8 12 3.5z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4.5l2-3A8 8 0 1 1 21 12z"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M5 5v5m0 4v5m7-14v9m0 4v1m7-14v1m0 4v9"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="10" r="2"/><circle cx="19" cy="8" r="2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v2M6.5 7l1 12.5A1.5 1.5 0 0 0 9 21h6a1.5 1.5 0 0 0 1.5-1.5L17.5 7"/></symbol>
</svg>

<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
    <div class="brand">
      <span class="brand-logo"><svg><use href="#i-spark"/></svg></span>
      NightCode <em>PRO</em>
    </div>
    <button class="icon-btn" id="moreBtn" aria-label="Settings"><svg><use href="#i-more"/></svg></button>
  </header>

  <main id="chat" class="chat">
    <section id="welcome" class="welcome">
      <div class="star"><svg><use href="#i-moon"/></svg></div>
      <h1>Hello, night owl</h1>
      <p>Your local AI coding workspace</p>
      <button class="quick" id="newChat">
        <span class="quick-ico"><svg><use href="#i-plus"/></svg></span>
        <span class="quick-text"><b>New chat</b><small>Start a fresh conversation</small></span>
        <span class="quick-arrow"><svg><use href="#i-arrow-r"/></svg></span>
      </button>
      <button class="quick" id="openProjectCard">
        <span class="quick-ico"><svg><use href="#i-folder"/></svg></span>
        <span class="quick-text"><b>Open project</b><small id="openProjectSub">Continue coding</small></span>
        <span class="quick-arrow"><svg><use href="#i-arrow-r"/></svg></span>
      </button>
    </section>
  </main>

  <aside id="drawer" class="drawer">
    <div class="drawer-head"><b>NightCode</b><button class="icon-btn" id="closeDrawer"><svg><use href="#i-close"/></svg></button></div>
    <button class="primary" id="drawerNew"><svg><use href="#i-plus"/></svg>New chat</button>
    <div class="muted-label">Recent chats</div>
    <div id="recent"></div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <div id="addSheet" class="sheet">
    <div class="sheet-title">Add to chat</div>
    <div class="add-grid">
      <button onclick="openFiles()"><svg><use href="#i-camera"/></svg><small>Camera</small></button>
      <button onclick="openFiles()"><svg><use href="#i-image"/></svg><small>Photos</small></button>
      <button onclick="openFiles()"><svg><use href="#i-file"/></svg><small>Files</small></button>
    </div>
    <button class="sheet-row" id="rowProjectFolder"><span class="row-ico"><svg><use href="#i-folder"/></svg></span>Project folder<span class="row-arrow"><svg><use href="#i-arrow-r"/></svg></span></button>
    <button class="sheet-row" id="rowWebSearch"><span class="row-ico"><svg><use href="#i-globe"/></svg></span>Web search<span class="row-arrow"><svg><use href="#i-arrow-r"/></svg></span></button>
    <button class="sheet-row" id="rowAddToProject"><span class="row-ico"><svg><use href="#i-file"/></svg></span>Add to project<span class="row-arrow"><svg><use href="#i-arrow-r"/></svg></span></button>
    <button class="sheet-row" id="rowToolAccess"><span class="row-ico"><svg><use href="#i-sliders"/></svg></span>Tool access<span class="row-arrow"><svg><use href="#i-arrow-r"/></svg></span></button>
  </div>

  <div id="settingsSheet" class="sheet">
    <div class="sheet-title">Connection</div>
    <label>Base URL<input id="baseUrl" placeholder="https://api.example.com"></label>
    <label>API key<input id="apiKey" type="password" placeholder="API key"></label>
    <button class="primary" id="saveSettings">Save &amp; refresh models</button>
    <div class="muted-label">Workspace</div>
    <div id="workspaceStatus" class="workspace-status"></div>
    <label class="switch-row">Use permanent workspace folder<input id="wsEnabled" type="checkbox"></label>
    <button class="secondary" id="wsPick">Choose workspace folder</button>
    <button class="secondary" id="wsClear">Disconnect workspace</button>
    <div class="muted-label">Advanced</div>
    <button class="sheet-row link" id="contextBtn"><span class="row-ico"><svg><use href="#i-sliders"/></svg></span>Context &amp; memory<span class="row-arrow"><svg><use href="#i-arrow-r"/></svg></span></button>
    <div id="settingsError" class="error"></div>
  </div>

  <div id="modelSheet" class="sheet">
    <div class="sheet-title">Select model</div>
    <div id="models"></div>
    <button class="secondary" id="refreshModels">Refresh models</button>
  </div>

  <div id="contextSheet" class="sheet">
    <div class="sheet-title">Context &amp; memory</div>
    <label>Input context tokens<input id="inputTokens" inputmode="numeric"></label>
    <label>Max output tokens<input id="outputTokens" inputmode="numeric"></label>
    <label class="switch-row">Auto compact <input id="autoCompact" type="checkbox"></label>
    <label>Compact threshold %<input id="threshold" inputmode="numeric"></label>
    <button class="primary" id="saveContext">Save</button>
    <button class="secondary" id="compactNow">Compact context now</button>
  </div>

  <div id="sheetScrim" class="sheet-scrim"></div>

  <div class="composer-wrap">
    <div id="attachments" class="attachments"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask NightCode anything…"></textarea>
      <div class="composer-bar">
        <button class="icon-btn" id="addBtn"><svg><use href="#i-plus"/></svg></button>
        <button class="model-btn" id="modelBtn">Model</button>
        <span></span>
        <button class="send-btn" id="sendBtn"><svg><use href="#i-arrow-up"/></svg></button>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
